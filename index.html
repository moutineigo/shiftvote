<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シフト入力</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  padding: 8px; 
  background: #f7f7f7;
}

header {
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 10;
  border-bottom: 1px solid #ccc;
  /* padding: 10px; */
  padding: calc(10px + env(safe-area-inset-top)) 10px 10px;

}



h1 {
  margin: 0;
  font-size: 18px;
}

.deadline {
  font-size: 12px;
  color: #555;
}

/*
.table-wrap {
  overflow: auto;
  height: calc(100vh - var(--header-h, 52px));
  background: #fff;
}
*/

.table-wrap{
  overflow: auto;
  overscroll-behavior: contain;
  height: calc(100vh - var(--header-h, 52px) - 16px);

  padding-top: 0;
  padding-left: 0;
  padding-right: 8px;

  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  background: #fff;
  border-radius: 10px;
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: max-content;
  background: #fff;
}

th, td {
  border: 1px solid #ccc;
  min-width: 56px;
  height: 48px;
  text-align: center;
  font-size: 18px;
  overflow: hidden;  
}

th {
  background: #f0f0f0;
  font-size: 12px;
}

th.sticky-left.sticky-top{
  z-index: 8;
}

th.sticky-top{
  position: sticky;
  top: 0; 
  z-index: 5;
  background: #f0f0f0;
}

th.sticky-left,
td.sticky-left {
  position: sticky;
  left: 0;
  background: #fff;
  z-index: 4;
}

th.sticky-left {
  background: #f0f0f0;
  z-index: 6;
}

td.cell {
  cursor: default;
}

td.cell.saving {
  opacity: 0.5;
}

.date-head {
  line-height: 1.2;
  font-size: 11px;
}

.cell-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  height: 100%;
}

.cell-btns {
  display: flex;
  gap: 4px;
}

.cell-btn {
  width: 22px;
  height: 22px;
  font-size: 13px;
  border-radius: 4px;
  border: 1px solid #e67e22;
  background: #ffe5d0;
  padding: 0;
  cursor: pointer;
}

.cell-cur {
  font-size: 18px;
  line-height: 1;
  margin-top: 4px;
}

th.lock-head {
  min-width: 92px;
  font-size: 12px;
}

td.lock-cell {
  min-width: 92px;
  background: #f9fbff;
}

.lock-btn {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid #4aa3df;
  background: #cfefff;
  cursor: pointer;
}

.lock-btn.is-ok {
  background: #bfe6ff;
}

.lock-btn.is-ng {
  background: #d7f2ff;
  opacity: 0.95;
}

/* ロック中：その行の入力ボタンを無効化 */
tr.is-locked td.cell .cell-btn {
  pointer-events: none;
  opacity: 0.35;
}

tr.is-locked td.cell .cell-cur {
  opacity: 0.8;
}

.lock-stack {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px 0;
}

.lock-btn.is-disabled {
  opacity: 0.35;
  pointer-events: none;
  filter: grayscale(100%);
}

td, th { position: relative; }

/* 左固定（担当者列）：本文より上 */
td.sticky-left {
  z-index: 20;
}

/* 上固定（ヘッダ行）：本文より上 */
th.sticky-top {
  z-index: 30;
}

/* 左上（担当者ヘッダ）：最前面 */
th.sticky-left.sticky-top {
  z-index: 40;
}

td.cell { padding: 0; }
.cell-box {
  width: 100%;
  height: 100%;
  overflow: hidden;
  box-sizing: border-box;
}

@supports (height: 100dvh) {
  .table-wrap{
    height: calc(100dvh - var(--header-h, 52px) - 16px);
  }
}

@media (max-width: 768px) {
  th.sticky-left,
  td.sticky-left {
    min-width: 90px;
    width: 90px;
    font-size: 15px;
    white-space: normal;
    word-break: break-all;
  }
}

/* ===== 見やすさ用：偶数行/偶数列を薄く色替え ===== */

/* まず tbody のセル背景を透明にする（行の背景が見えるように） */
#shiftTable tbody td { background: transparent; }

/* 行の縞（tr に背景を持たせる） */
#shiftTable tbody tr:nth-child(odd)  { background: #ffffff; }
#shiftTable tbody tr:nth-child(even) { background: #d9d9d9; }

/* 列の縞（半透明で上乗せ：行の縞が消えない） */
#shiftTable tbody td:nth-child(even) { background: rgba(230, 239, 255, 0.65); }

/* 偶数行×偶数列は少し濃く */
#shiftTable tbody tr:nth-child(even) td:nth-child(even) { background: rgba(230, 239, 255, 0.85); }

/* sticky-left / lock-cell も “行の背景” を継承させる（ここが重要） */
#shiftTable tbody td.sticky-left,
#shiftTable tbody td.lock-cell {
  background: inherit;
}

#shiftTable tbody tr:hover td { background: #fff3d9; }
#shiftTable tbody tr:hover td.sticky-left { background: #fff3d9; }

#shiftTable tbody tr:hover td:nth-child(even),
#shiftTable tbody tr:hover td:nth-child(even):nth-child(even) {
  background: #fff3d9 !important;
}

/* lock列と担当者列も確実に揃える */
#shiftTable tbody tr:hover td.sticky-left,
#shiftTable tbody tr:hover td.lock-cell {
  background: #fff3d9 !important;
}

#shiftTable tbody tr.is-hover-row td {
  background: #fff3d9 !important;
}

/* 列ハイライト */
#shiftTable tbody td.is-hover-col {
  background: #fff3d9 !important;
}

/* sticky列も含める */
#shiftTable tbody tr.is-hover-row td.sticky-left,
#shiftTable tbody td.is-hover-col.sticky-left,
#shiftTable tbody td.is-hover-col.lock-cell {
  background: #fff3d9 !important;
}

/* ===== コメントモーダル ===== */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background: rgba(0,0,0,0.35);
  align-items:center;
  justify-content:center;
  z-index: 1000;
  padding: 16px;
}

.modal.show{ display:flex; }

.modal-box{
  width: min(520px, 100%);
  background:#fff;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.25);
}

.modal-title{
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
}

#commentText{
  width: 100%;
  height: 140px;
  resize: vertical;
  font-size: 14px;
  line-height: 1.4;
  padding: 10px;
  box-sizing: border-box;
}

.modal-actions{
  display:flex;
  gap: 8px;
  justify-content:flex-end;
  margin-top: 10px;
}

.modal-actions button{
  font-size: 14px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #bbb;
  background: #f5f5f5;
  cursor: pointer;
}

th.comment-head { min-width: 64px; }
td.comment-cell { min-width: 64px; background: inherit; }

.comment-btn{
  width: 40px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid #bbb;
  background: #fff;
  cursor: pointer;
}

/* 集計行（ヘッダ2段目） */
th.summary-top{

th.summary-top.sticky-top { z-index: 29; }              /* 1段目(30)より一段下 */
th.summary-top.sticky-left { z-index: 41; }             /* 左固定の集計セルは最前面寄り */
th.summary-top.sticky-left.sticky-top { z-index: 50; }  /* 左上（集計×担当者）を最前面 */

  position: sticky;
  top: 48px;          /* 1段目ヘッダの高さに合わせる（後述でJSから上書き推奨） */
  z-index: 29;
  background: #f0f0f0;
  font-size: 11px;
  line-height: 1.25;
  height: 40px;       /* 少し低め */
  vertical-align: middle;
}

.summary-box{
  display: grid;
  grid-template-columns: repeat(5, auto);
  gap: 6px 10px;
  justify-content: center;
  white-space: nowrap;
}

.summary-box span{
  font-variant-numeric: tabular-nums;
}

</style>
</head>

<header>
  <h1 id="title">Loading...</h1>

  <table id="shiftTable"></table>
</div>

<div id="commentModal" class="modal" aria-hidden="true">
  <div class="modal-box">
    <div class="modal-title">コメント</div>
    <textarea id="commentText" maxlength="1000" placeholder="最大1000文字"></textarea>
    <div class="modal-actions">
      <button id="commentSave" type="button">OK(保存)</button>
      <button id="commentCancel" type="button">キャンセル</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwutpg6zvSr1Inx7kZIrtyakRo5-A_4Bs0ZaQOrsY7PN3776wYn0yEHoSc0xW7zS5c/exec";
const params = new URLSearchParams(location.search);
const month = params.get("month") || "2026-08";

let META = null;

function isRowComplete_(memberId) {
  // その担当者の全日程が「ー以外」ならOK
  return META.dates.every(d => {
    const v = RESP_MAP[`${memberId}|${d.date}`] || "ー";
    return v !== "ー" && v !== "";
  });
}


let RESP_MAP = {};
let COMMENT_MAP = {};
let lastTouched = {};

let CURRENT_COMMENT_MEMBER_ID = null;

function openCommentModal_(memberId) {
  CURRENT_COMMENT_MEMBER_ID = memberId;

  const modal = document.getElementById("commentModal");
  const ta = document.getElementById("commentText");
  ta.value = (COMMENT_MAP[memberId] || "");

  modal.classList.add("show");
  modal.setAttribute("aria-hidden", "false");

  // 少し待ってフォーカス（iOS対策）
  setTimeout(() => ta.focus(), 0);
}

function closeCommentModal_() {
  const modal = document.getElementById("commentModal");
  modal.classList.remove("show");
  modal.setAttribute("aria-hidden", "true");
  CURRENT_COMMENT_MEMBER_ID = null;
}

async function saveComment_() {
  if (!CURRENT_COMMENT_MEMBER_ID) return;

  const text = String(document.getElementById("commentText").value || "");

  // 1000文字制限（保険）
  const clipped = text.length > 1000 ? text.slice(0, 1000) : text;

  const url =
    `${API_URL}?action=setcomment` +
    `&month_key=${encodeURIComponent(META.month_key)}` +
    `&member_id=${encodeURIComponent(CURRENT_COMMENT_MEMBER_ID)}` +
    `&comment=${encodeURIComponent(clipped)}`;

  const res = await fetchJSON(url);
  if (!res.ok) {
    alert("コメント保存失敗: " + (res.error || ""));
    return;
  }

  // ローカル反映 → 📝/＋ を即更新
  COMMENT_MAP[CURRENT_COMMENT_MEMBER_ID] = clipped;
  closeCommentModal_();
  render();
  setupHoverHighlight_(); // render後にホバー再バインド
}


function nextValue(cur, choices) {
  const i = choices.indexOf(cur);
  return choices[(i + 1) % choices.length];
}

async function fetchJSON(url) {
  const r = await fetch(url);
  return r.json();
}

async function postJSON(body) {
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(r => r.json());
}

function buildRespMap(responses) {
  const map = {};
  responses.forEach(r => {
    map[`${r.member_id}|${r.date}`] = r.value;
  });
  return map;
}

function buildDaySummary_(dateStr) {
  const counts = { "〇":0, "×":0, "△":0, "？":0, "ー":0 };

  META.members.forEach(m => {
    const v = RESP_MAP[`${m.member_id}|${dateStr}`] || "ー";
    if (counts[v] === undefined) counts["ー"]++;
    else counts[v]++;
  });

  return counts;
}


function refreshSummaryForDate_(dateStr){
  const idx = META.dates.findIndex(d => d.date === dateStr);
  if (idx < 0) return;

  // 集計行は thead の2行目（1行目=日時、2行目=集計）
  const tr2 = document.querySelector("#shiftTable thead tr:nth-child(2)");
  if (!tr2) return;

  // 左3列（担当者/ロック/コメント）の次が日付列
  const th = tr2.children[3 + idx];
  if (!th) return;

  const c = buildDaySummary_(dateStr);
  th.innerHTML = `
    <div class="summary-box">
      <span>〇:${c["〇"]}</span>
      <span>×:${c["×"]}</span>
      <span>△:${c["△"]}</span>
      <span>？:${c["？"]}</span>
      <span>ー:${c["ー"]}</span>
    </div>
  `;
}

function render() {
  const table = document.getElementById("shiftTable");
  table.innerHTML = "";

  const thead = document.createElement("thead");
  const tr1 = document.createElement("tr");

  const thName = document.createElement("th");
  thName.textContent = "担当者";
  thName.className = "sticky-left sticky-top";
  tr1.appendChild(thName);

  const thLock = document.createElement("th");
  thLock.textContent = "記入ロック";
  thLock.className = "sticky-top lock-head";
  tr1.appendChild(thLock);

  const thComment = document.createElement("th");
  thComment.textContent = "コメント";
  thComment.className = "sticky-top  comment-head";
  tr1.appendChild(thComment);

  META.dates.forEach(d => {
    const th = document.createElement("th");
    th.className = "sticky-top";
    th.innerHTML = `
      <div class="date-head">
        ${d.date.slice(5).replace("-", "/")}<br>
        ${d.weekday}<br>
        ${d.time}<br>
        ${d.place}
      </div>`;
    tr1.appendChild(th);
  });

  thead.appendChild(tr1);

  // ===== 集計行（ヘッダ2段目）=====
  const tr2 = document.createElement("tr");

  // 左3列（担当者/ロック/コメント）は空でOK（または「集計」と書く）
  const thS1 = document.createElement("th");
  thS1.className = "sticky-left sticky-top summary-top";
  thS1.textContent = "";   // ここに "集計" と書いてもOK
  tr2.appendChild(thS1);

  const thS2 = document.createElement("th");
  thS2.className = "sticky-top summary-top";
  thS2.textContent = "";
  tr2.appendChild(thS2);

  const thS3 = document.createElement("th");
  thS3.className = "sticky-top summary-top";
  thS3.textContent = "";
  tr2.appendChild(thS3);

  // 日付列ごとの集計
  META.dates.forEach(d => {
    const th = document.createElement("th");
    th.className = "summary-top";

    const c = buildDaySummary_(d.date);

    th.innerHTML = `
      <div class="summary-box">
        <span>〇:${c["〇"]}</span>
        <span>×:${c["×"]}</span>
        <span>△:${c["△"]}</span>
        <span>？:${c["？"]}</span>
        <span>ー:${c["ー"]}</span>
      </div>
    `;
    tr2.appendChild(th);
  });

  thead.appendChild(tr2);


  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  META.members.forEach(m => {
    const tr = document.createElement("tr");

    const tdName = document.createElement("td");
    tdName.textContent = m.member_name;
    tdName.className = "sticky-left";
    tr.appendChild(tdName);


////////
  const tdLock = document.createElement("td");
  tdLock.className = "lock-cell";

  const wrap = document.createElement("div");
  wrap.className = "lock-stack";

  const locked = !!m.locked; // ← members.locked を参照

  // 行のロック反映（ロック中はセル編集不可）
  if (locked) tr.classList.add("is-locked");

  const btnLock = document.createElement("button");
  btnLock.type = "button";
  btnLock.className = "lock-btn";
  btnLock.textContent = "ロック";

  const btnUnlock = document.createElement("button");
  btnUnlock.type = "button";
  btnUnlock.className = "lock-btn";
  btnUnlock.textContent = "ロック解除";

  // 状態に応じて押せる/押せないを切替（画像仕様）
  if (locked) {
    btnLock.classList.add("is-disabled");     // ロック中は「ロック」押せない
  } else {
    btnUnlock.classList.add("is-disabled");   // 解除中は「ロック解除」押せない
  }

  async function setLocked(nextLocked) {
    // optimistic
    const prev = m.locked;
    m.locked = nextLocked;
    render();

    const url =
      `${API_URL}?action=setmemberlock` +
      `&month_key=${encodeURIComponent(META.month_key)}` + 
      `&member_id=${encodeURIComponent(m.member_id)}` +
      `&locked=${nextLocked}`;

    const res = await fetchJSON(url);
    if (!res.ok) {
      alert("ロック更新失敗: " + (res.error || ""));
      // rollback
      m.locked = prev;
      render();
    }
  }

  btnLock.onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (m.locked) return;
    setLocked(true);
  };

  btnUnlock.onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (!m.locked) return;
    setLocked(false);
  };

  wrap.appendChild(btnLock);
  wrap.appendChild(btnUnlock);
  tdLock.appendChild(wrap);
  tr.appendChild(tdLock);

  const tdComment = document.createElement("td");
  tdComment.className = "comment-cell";

  const btnC = document.createElement("button");
  btnC.type = "button";
  btnC.className = "comment-btn";
  btnC.textContent =
   (COMMENT_MAP[m.member_id] && COMMENT_MAP[m.member_id].trim()) ? "📝" : "＋";

  btnC.onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    openCommentModal_(m.member_id);
  };

  tdComment.appendChild(btnC);
  tr.appendChild(tdComment);

    META.dates.forEach(d => {
      const key = `${m.member_id}|${d.date}`;

const td = document.createElement("td");

*/

    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  requestAnimationFrame(() => {
    setStickyTop_();       // ヘッダ（青バー）高さをCSS変数へ
    adjustSummaryTop_();   // 1段目ヘッダ高さに合わせて集計行をずらす
  });

}


function setStickyTop_() {
  const h = document.querySelector("header")?.offsetHeight || 52;
  document.documentElement.style.setProperty("--header-h", `${h}px`);
}

function adjustSummaryTop_(){
  // 1段目ヘッダの高さ（日時/場所行）
  const firstHead = document.querySelector("#shiftTable thead tr:first-child th");
  const h1 = firstHead ? firstHead.offsetHeight : 48;

  // 集計行（summary-top）の sticky top を合わせる
  document.querySelectorAll("th.summary-top").forEach(th => {
    th.style.top = `${h1}px`;
  });
}

let loading = false;

function bindCommentModalButtons_() {
  const btnSave = document.getElementById("commentSave");
  const btnCancel = document.getElementById("commentCancel");
  const modal = document.getElementById("commentModal");

  if (btnSave) btnSave.onclick = saveComment_;
  if (btnCancel) btnCancel.onclick = closeCommentModal_;

  // 背景クリックで閉じる
  if (modal) {
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeCommentModal_();
    });
  }

  // Escで閉じる（PC）
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeCommentModal_();
  });

}



// ===== 行＋列ホバー強調（1回だけ登録）=====
function setupHoverHighlight_() {
  const table = document.getElementById("shiftTable");
  if (!table || table.dataset.hoverBound === "1") return;
  table.dataset.hoverBound = "1";

  table.addEventListener("mouseover", (e) => {
    const td = e.target.closest("td");
    if (!td) return;

    const tr = td.parentElement;
    const index = td.cellIndex;

    tr.classList.add("is-hover-row");

    document
      .querySelectorAll(`#shiftTable tbody tr td:nth-child(${index + 1})`)
      .forEach(cell => cell.classList.add("is-hover-col"));
  });

  table.addEventListener("mouseout", () => {
    document.querySelectorAll(".is-hover-row")
      .forEach(el => el.classList.remove("is-hover-row"));
    document.querySelectorAll(".is-hover-col")
      .forEach(el => el.classList.remove("is-hover-col"));
  });
}


async function loadAll() {
  // 多重起動防止（前回の loadAll が終わる前に次が走るのを防ぐ）
  if (loading) return;
  loading = true;

  try {
    setStickyTop_();

    // meta + responses を1回で取得（GAS側で action=all を実装している前提）
    const all = await fetchJSON(`${API_URL}?action=all&month=${month}`);

    // all.ok の確認（GASのjsonOut_仕様に合わせる）
    if (!all || all.ok === false) {
      alert("読み込み失敗: " + (all?.error || "unknown error"));
      return;
    }

    META = all.meta;

    // comments を反映（member_id -> comment）
    COMMENT_MAP = {};
    (all.comments || []).forEach(c => {
      COMMENT_MAP[c.member_id] = c.comment || "";
    });

    // 画面表示（タイトル・期限）
    document.getElementById("title").textContent = META.title || "";
    document.getElementById("deadline").textContent = "入力期限: " + (META.deadline || "");

    // responses を反映して描画
    RESP_MAP = buildRespMap(all.responses || []);
    render();

    setupHoverHighlight_();

  } catch (err) {
    alert("読み込みエラー: " + String(err));
  } finally {
    loading = false;

    // 自動再読込（meta が取れた場合のみ）
    if (META && Number(META.ui_refresh_sec) > 0) {
      setTimeout(loadAll, Number(META.ui_refresh_sec) * 1000);
    }
  }
}

bindCommentModalButtons_();
loadAll();
</script>
